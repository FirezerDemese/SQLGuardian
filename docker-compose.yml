version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlguardian-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SQLGuardian@2024"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./scripts:/scripts
    healthcheck:
       test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "SQLGuardian@2024" -Q "SELECT 1" -No -C
       interval: 15s
       timeout: 10s
       retries: 15
       start_period: 30s
    networks:
      - sqlguardian-net

  sqlguardian-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sqlguardian-api
    env_file:
    - .env
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      ODBCINI: /etc/odbc.ini
    ports:
      - "8000:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      # The ingested runbook corpus and the condition-firing log that the gap
      # report is built from. Without this they are lost on every restart, and
      # a gap report that resets is not evidence of anything.
      - guardian_data:/app/data
    networks:
      - sqlguardian-net
    restart: unless-stopped

volumes:
  sqlserver_data:
  guardian_data:

networks:
  sqlguardian-net:
    driver: bridge
